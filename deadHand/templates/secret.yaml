apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deadHand.fullname" . }}-secret
  labels:
    {{- include "deadHand.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_ACCESS_TTL_MIN: {{ .Values.secrets.jwtAccessTtlMin | quote }}
  JWT_REFRESH_TTL_DAYS: {{ .Values.secrets.jwtRefreshTtlDays | quote }}
  FERNET_KEY: {{ .Values.secrets.fernetKey | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  GOOGLE_REDIRECT_URI: {{ .Values.secrets.googleRedirectUri | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  SMTP_FROM: {{ .Values.secrets.smtpFrom | quote }}
  SENDGRID_API_KEY: {{ .Values.secrets.sendgridApiKey | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
